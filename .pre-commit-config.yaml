# Git hooks. Python tools run through uv so versions come from uv.lock (single source of truth).
# Third-party hook repos are frozen to commit SHAs (same reasoning as ADR-0011 for GitHub Actions).
default_install_hook_types: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy (strict, core + adapters)
        entry: uv run --frozen mypy
        language: system
        pass_filenames: false
        files: ^packages/(core|adapters)/.*\.py$
      - id: import-linter
        name: import-linter (layering contracts)
        entry: uv run --frozen lint-imports
        language: system
        pass_filenames: false
        files: \.py$
