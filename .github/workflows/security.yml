# Secret scanning, workflow audit, dependency vulnerabilities. Blueprint §13; ADR-0011.
name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * 1" # weekly, Monday 02:17 UTC

permissions: {}

jobs:
  scan:
    name: gitleaks · zizmor · pip-audit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Secrets (gitleaks via pre-commit)
        run: uvx pre-commit run gitleaks --all-files
      - name: Workflow audit (zizmor)
        # Placeholder workflows stay empty until their checkpoint; audit only filled ones.
        run: find .github/workflows -name '*.yml' -size +0c -print0 | xargs -0 uvx zizmor==1.30.1 --min-severity high
      - name: Actions pinned by SHA
        run: bash scripts/gates/check_actions_pinned.sh
      - name: Dependency vulnerabilities (pip-audit)
        run: |
          uv export --frozen --all-packages --no-emit-workspace --no-hashes --format requirements-txt > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --no-deps --disable-pip -r "$RUNNER_TEMP/requirements.txt"
