# Lint, types and fast tests on every PR and on main. Blueprint §9, §10; ADR-0011 (SHA pins, least privilege).
name: ci-python

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · types · tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install workspace (frozen lockfile)
        run: uv sync --all-packages --frozen
      - name: Lint + layering
        run: make lint
      - name: Types
        run: make type
      - name: Fast tests
        run: make test
      - name: Core tests + doctests + coverage gate
        run: make test-core
